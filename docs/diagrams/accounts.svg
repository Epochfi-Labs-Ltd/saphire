ed</text><text x='624' y='288' text-anchor='middle' font-size='11.5' font-weight='400' fill='#6b7280'>and balance, Market open_interest,</text><text x='624' y='304' text-anchor='middle' font-size='11.5' font-weight='400' fill='#6b7280'>Market rate_index</text><text x='624' y='350' text-anchor='middle' font-size='11.5' font-weight='400' fill='#6b7280'>Rule: mutate only the fields the</text><text x='624' y='366' text-anchor='middle' font-size='11.5' font-weight='400' fill='#6b7280'>ownership table assigns; never reset</text><text x='624' y='382' text-anchor='middle' font-size='11.5' font-weight='400' fill='#6b7280'>a shared account</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>