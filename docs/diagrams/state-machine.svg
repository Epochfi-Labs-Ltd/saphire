<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 740' width='760' height='740' font-family='Inter, Helvetica, Arial, sans-serif' xmlns:c2pa="http://c2pa.org/manifest"><rect width='760' height='740' fill='white'/><defs><marker id='ar4' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#9ca3af'/></marker></defs><text x='24' y='34' text-anchor='start' font-size='15' font-weight='600' fill='#1f2937'>Happy path: Requested, Quoted, Agreed off-chain; Open (forward), Open (live), Settled on-chain</text><rect x='24' y='96' width='712' height='296' rx='8' fill='#f3f4f6' stroke='#9ca3af' stroke-dasharray='4 4'/><text x='40' y='118' text-anchor='start' font-size='11.5' font-weight='600' fill='#6b7280'>OFF-CHAIN, amendable</text><rect x='24' y='408' width='712' height='308' rx='8' fill='#2f6fdb' fill-opacity='0.05' stroke='#2f6fdb'/><text x='720' y='706' text-anchor='end' font-size='11.5' font-weight='600' fill='#6b7280'>ON-CHAIN: immutable once Open</text><path d='M260 162.0V218.0' fill='none' stroke='#9ca3af' stroke-width='1.25' marker-end='url(#ar4)'/><path d='M260 262.0V318.0' fill='none' stroke='#9ca3af' stroke-width='1.25' marker-end='url(#ar4)'/><path d='M260 362.0V438.0' fill='none' stroke='#9ca3af' stroke-width='1.25' marker-end='url(#ar4)'/><path d='M260 482.0V538.0' fill='none' stroke='#9ca3af' stroke-width='1.25' marker-end='url(#ar4)'/><path d='M260 582.0V638.0' fill='none' stroke='#9ca3af' stroke-width='1.25' marker-end='url(#ar4)'/><path d='M360.0 460H500.0' fill='none' stroke='#9ca3af' stroke-width='1.25' marker-end='url(#ar4)'/><path d='M360.0 560H500.0' fill='none' stroke='#9ca3af' stroke-width='1.25' marker-end='url(#ar4)'/><path d='M160.0 240H140V140H160.0' fill='none' stroke='#9ca3af' stroke-width='1.25' stroke-dasharray='4 4' marker-end='url(#ar4)'/><rect x='160.0' y='118.0' width='200' height='44' rx='8' fill='none' fill-opacity='1' stroke='#9ca3af' stroke-width='1.25'/><text x='260' y='145' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2937'>REQUESTED</text><rect x='160.0' y='218.0' width='200' height='44' rx='8' fill='none' fill-opacity='1' stroke='#9ca3af' stroke-width='1.25'/><text x='260' y='245' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2937'>QUOTED</text><rect x='160.0' y='318.0' width='200' height='44' rx='8' fill='none' fill-opacity='1' stroke='#9ca3af' stroke-width='1.25'/><text x='260' y='345' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2937'>AGREED</text><rect x='160.0' y='438.0' width='200' height='44' rx='8' fill='#2f6fdb' fill-opacity='0.12' stroke='#2f6fdb' stroke-width='2'/><text x='260' y='465' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2937'>OPEN · FORWARD</text><rect x='160.0' y='538.0' width='200' height='44' rx='8' fill='#2f6fdb' fill-opacity='0.12' stroke='#2f6fdb' stroke-width='2'/><text x='260' y='565' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2937'>OPEN · LIVE</text><rect x='160.0' y='638.0' width='200' height='44' rx='8' fill='none' fill-opacity='1' stroke='#9ca3af' stroke-width='1.25'/><text x='260' y='665' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2937'>SETTLED</text><rect x='500.0' y='438.0' width='200' height='44' rx='8' fill='none' fill-opacity='1' stroke='#9ca3af' stroke-width='1.25'/><text x='600' y='465' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2937'>CLOSED</text><rect x='500.0' y='538.0' width='200' height='44' rx='8' fill='none' fill-opacity='1' stroke='#9ca3af' stroke-width='1.25'/><text x='600' y='565' text-anchor='middle' font-size='14' font-weight='600' fill='#1f2937'>UNWOUND</text><text x='272' y='110' text-anchor='start' font-size='11.5' font-weight='400' fill='#6b7280'>Trader sends a request: side, notional, tenor</text><text x='272' y='188.0' text-anchor='start' font-size='11.5' font-weight='400' fill='#6b7280'>Operator quotes a rate and its validity</text><text x='272' y='288.0' text-anchor='start' font-size='11.5' font-weight='400' fill='#6b7280'>Trader accepts; both sign the deal</text><text x='272' y='304.0' text-anchor='start' font-size='11.5' font-weight='400' fill='#6b7280'>deal carries explicit period_start and period_end</text><text x='132' y='188.0' text-anchor='end' font-size='11.5' font-weight='400' fill='#6b7280'>either side</text><text x='132' y='204.0' text-anchor='end' font-size='11.5' font-weight='400' fill='#6b7280'>amends terms</text><text x='272' y='380' text-anchor='start' font-size='11.5' font-weight='400' fill='#6b7280'>Trader submits the signed deal before period_start</text><text x='272' y='430' text-anchor='start' font-size='11.5' font-weight='400' fill='#6b7280'>Program verifies signatures, dates; locks margin and reserve</text><text x='272' y='508.0' text-anchor='start' font-size='11.5' font-weight='400' fill='#6b7280'>Clock: period_start reached</text><text x='272' y='524.0' text-anchor='start' font-size='11.5' font-weight='400' fill='#6b7280'>accrual starts; start offset e.g. 3 months</text><text x='272' y='608.0' text-anchor='start' font-size='11.5' font-weight='400' fill='#6b7280'>Operator publishes the fixing at period_end</text><text x='272' y='624.0' text-anchor='start' font-size='11.5' font-weight='400' fill='#6b7280'>Anyone settles: pay out, release locks</text><text x='720' y='500' text-anchor='end' font-size='11.5' font-weight='400' fill='#6b7280'>Trader closes early at quote</text><text x='720' y='516' text-anchor='end' font-size='11.5' font-weight='400' fill='#6b7280'>any time before period_end</text><text x='720' y='600' text-anchor='end' font-size='11.5' font-weight='400' fill='#6b7280'>Anyone unwinds after grace</text><text x='720' y='616' text-anchor='end' font-size='11.5' font-weight='400' fill='#6b7280'>if no fixing was published</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>