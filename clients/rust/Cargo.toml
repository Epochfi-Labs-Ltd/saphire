[package]
name = "saphire-client"
version = "0.1.0"
description = "Rust client for Saphire, generated by Codama from the Anchor IDL (see scripts/generate-clients.mjs)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

# Dependencies are maintained by hand (syncCargoToml is off) so they resolve
# against the workspace's Solana 3.x / Anchor 1.2.2 graph.
[dependencies]
borsh = "1"
num-derive = "0.4"
num-traits = "0.2"
solana-account = "4"
solana-account-info = "3.1"
solana-address = { version = "2.2", features = ["borsh", "copy", "curve25519", "decode"] }
solana-cpi = "3.1"
solana-instruction = "3.2"
solana-program-error = "3.0"
thiserror = "1"

[lints.rust]
# The generated code gates RPC helpers behind `feature = "fetch"`; this crate
# does not offer that feature (it would pull in solana-rpc-client).
unexpected_cfgs = "allow"
